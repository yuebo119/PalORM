name: Performance Gate

on:
  # 每周日凌晨 2:00 自动运行（追踪性能趋势）
  schedule:
    - cron: '0 2 * * 0'
  # 手动触发
  workflow_dispatch:
  # PR 带 [perf] 标签时运行（job 级 if 门控——此前裸 pull_request 触发器
  # 与注释声称的标签语义不符，且 restore 必败导致每个 PR 白跑）
  pull_request:
    branches: [main, dev]

# 排程与手动触发可能重叠——同分支新运行取消旧运行
concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-benchmark:
    name: SQLite Benchmark Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 标签门控：仅 [perf] PR / 排程 / 手动触发实际执行（P0-1 修复的一部分：
    # 此前所有 PR 无条件进入本 job 并在 Restore 步必然失败）
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'perf')

    steps:
      - uses: actions/checkout@v4

      - name: Clone BenchmarkDotNet fork
        env:
          # bench/PalORM.Benchmarks 以 ProjectReference 引用本地 BDN fork（.gitignore 排除，
          # 不入仓库）。默认 clone 上游 master（net11 支持已合入主线）；如使用私有 fork，
          # 在仓库 Variables 配置 BDN_FORK_URL 覆盖。P0-1 修复核心：此前此目录在 runner 上
          # 不存在，dotnet restore 解析 ProjectReference 必然失败，本 workflow 从未生效。
          BDN_FORK_URL: ${{ vars.BDN_FORK_URL || 'https://github.com/dotnet/BenchmarkDotNet.git' }}
        run: |
          git clone --depth 1 "$BDN_FORK_URL" bench/BenchmarkDotNet

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        # 只 restore 基准项目及其依赖链——restore 整个 slnx 会拖入全部测试项目（无谓耗时）
        run: dotnet restore bench/PalORM.Benchmarks/PalORM.Benchmarks.csproj

      - name: Build Benchmarks (Release)
        run: dotnet build bench/PalORM.Benchmarks/PalORM.Benchmarks.csproj -c Release --no-restore

      - name: Run SQLite Benchmarks
        run: |
          dotnet run --project bench/PalORM.Benchmarks -c Release --no-build -- \
            --filter '*SqliteBenchmarks*' \
            --exporters json \
            2>&1 | tee benchmark-output.log

      - name: Extract Results
        id: results
        run: |
          # 从 BenchmarkDotNet 输出提取关键指标
          echo "## Performance Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Mean | Allocated |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------|-----------|" >> $GITHUB_STEP_SUMMARY
          grep '|.*us\||.*ms' benchmark-output.log | grep '^|' | while read line; do
            echo "$line" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check Regression (vs baseline)
        run: |
          # P2-6 修复：基线从 v4.0.json 升级到 v5.0.json（当前版本对照）；
          # 解析失败不再静默放行——以 ::warning:: 显式标注"门禁不可判定"，
          # 但不阻断排程任务（避免日志格式漂移把整条流水线打红后被直接禁用）。
          BASELINE_FILE="bench/baselines/v5.0.json"
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "::warning::No baseline file found at $BASELINE_FILE — regression check inconclusive"
            exit 0
          fi

          echo "Checking regression against $BASELINE_FILE..."
          # 提取基线中的 PalORM_QueryAll median
          BASELINE_QUERYALL=$(python3 -c "
          import json
          with open('$BASELINE_FILE') as f:
              data = json.load(f)
          for b in data['benchmarks']:
              if b['name'] == 'PalORM_QueryAll':
                  print(b.get('median_ms', b.get('mean_ms', 'N/A')))
          " 2>/dev/null || echo "N/A")

          echo "Baseline PalORM_QueryAll median: ${BASELINE_QUERYALL}ms"
          echo "Regression threshold: +10% (Median > $(python3 -c "print(round(${BASELINE_QUERYALL:-999} * 1.1, 2))" 2>/dev/null || echo 'N/A')ms)"

          # 提取当前运行的 Median
          CURRENT_QUERYALL=$(grep 'PalORM_QueryAll' benchmark-output.log | grep 'ms |' | head -1 | awk -F'|' '{print $2}' | awk '{print $1}' || echo "N/A")
          echo "Current PalORM_QueryAll: ${CURRENT_QUERYALL}ms"

          # 回归判定（如果基线和当前值都可解析）
          if [ "$BASELINE_QUERYALL" != "N/A" ] && [ "$CURRENT_QUERYALL" != "N/A" ]; then
            python3 -c "
          baseline = float('${BASELINE_QUERYALL}')
          current = float('${CURRENT_QUERYALL}'.replace(',', ''))
          ratio = current / baseline
          print(f'Regression ratio: {ratio:.2%}')
          if ratio > 1.10:
              print(f'❌ REGRESSION: {ratio:.2%} > 10% threshold')
              exit(1)
          else:
              print(f'✅ OK: {ratio:.2%} <= 10% threshold')
          " || exit 1
          else
            echo "::warning::Could not parse baseline (${BASELINE_QUERYALL}) or current (${CURRENT_QUERYALL}) values — regression gate INCONCLUSIVE, not a pass"
            echo "⚠️ Regression check inconclusive (parse failure)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-output.log
            bench/PalORM.Benchmarks/BenchmarkDotNet.Artifacts/
          retention-days: 30
