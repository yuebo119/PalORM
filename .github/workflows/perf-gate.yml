name: Performance Gate

on:
  # 每周日凌晨 2:00 自动运行（追踪性能趋势）
  schedule:
    - cron: '0 2 * * 0'
  # 手动触发
  workflow_dispatch:
  # PR 带 [perf] 标签时运行（job 级 if 门控——此前裸 pull_request 触发器
  # 与注释声称的标签语义不符，且 restore 必败导致每个 PR 白跑）
  pull_request:
    branches: [main, dev]

# 排程与手动触发可能重叠——同分支新运行取消旧运行
concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-benchmark:
    name: SQLite Benchmark Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 标签门控：仅 [perf] PR / 排程 / 手动触发实际执行（P0-1 修复的一部分：
    # 此前所有 PR 无条件进入本 job 并在 Restore 步必然失败）
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'perf')

    steps:
      - uses: actions/checkout@v4

      - name: Clone BenchmarkDotNet fork
        env:
          # bench/PalORM.Benchmarks 以 ProjectReference 引用本地 BDN fork（.gitignore 排除，
          # 不入仓库）。默认 clone 上游 master（net11 支持已合入主线）；如使用私有 fork，
          # 在仓库 Variables 配置 BDN_FORK_URL 覆盖。P0-1 修复核心：此前此目录在 runner 上
          # 不存在，dotnet restore 解析 ProjectReference 必然失败，本 workflow 从未生效。
          BDN_FORK_URL: ${{ vars.BDN_FORK_URL || 'https://github.com/dotnet/BenchmarkDotNet.git' }}
        run: |
          git clone --depth 1 "$BDN_FORK_URL" bench/BenchmarkDotNet

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        # 只 restore 基准项目及其依赖链——restore 整个 slnx 会拖入全部测试项目（无谓耗时）
        run: |
          dotnet restore bench/PalORM.Benchmarks/PalORM.Benchmarks.csproj
          dotnet restore tools/PalORM.PerfGate/PalORM.PerfGate.csproj

      - name: Build Benchmarks (Release)
        run: dotnet build bench/PalORM.Benchmarks/PalORM.Benchmarks.csproj -c Release --no-restore

      - name: Run SQLite Benchmarks
        run: |
          # 范围：SQLite 上的 ORM 横评（PalORM / Dapper / RepoDb / ADO.NET 同 SQL 对照）。
          # 为什么是这个子集而不是全部 11 个类：
          #   ① PG/MySQL 两组需要外部数据库，本 job 不拉容器；
          #   ② BulkBenchmarks(100K) / GcBenchmarks 的批量矩阵 / SqlBuildBenchmarks(4096
          #      次调用 × Precision job) 单类就超过本 job 的 40 分钟预算；
          #   ③ 门禁要的是"同一轮内 PalORM 相对 ADO.NET 是否退化"，横评比绝对耗时更有判别力。
          # 完整矩阵请用 scripts/run-benchmarks.sh。
          #
          # 过滤器必须是实际类名。历史过滤器 '*SqliteBenchmarks*' 匹配不到任何类
          # （最接近的是 SqliteSpeedBenchmarks，中间隔着 Speed），实测 BDN 跑 0 个基准
          # 并以退出码 0 结束，后续回归检查恒拿不到当前值 → 长期以 warning 收尾，
          # 门禁结构上不可能变红。
          dotnet run --project bench/PalORM.Benchmarks -c Release --no-build -- \
            --filter '*CrudBenchmarks*' '*OrmComparisonBenchmarks*' \
            --launchCount 1 --warmupCount 3 --iterationCount 5 \
            --exporters json \
            2>&1 | tee benchmark-output.log
          # job 参数显式给 1/3/5（= BenchmarkConfig 里的 Fast 档，与基线录制时一致）：
          # 类级默认是 Standard 3/5/10，本 job 的 40 分钟预算跑不完全范围；
          # 门禁只对分配与比值设阈值，而分配是确定性指标、与迭代次数无关。

      - name: Extract Results
        if: always()
        run: |
          {
            echo "## Performance Results"
            echo ""
            echo '```'
            grep -E '^\|' benchmark-output.log | head -80
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Check Regression (vs baseline)
        # 判定由 tools/PalORM.PerfGate 执行（C#，与 run-benchmarks.sh 共用同一实现）。
        # 读 BDN 的 JSON（稳定契约），不读控制台表格。
        # 三个维度：分配字节数、分配比（同轮 PalORM/手写对照）、耗时比（同轮中位数之比）。
        # 不设绝对耗时阈值：实测同机两次运行的 ADO.NET 地板可漂 43%，绝对时间做门禁必然误报；
        # 比值在同轮内计算，把机器差异约掉。
        # 缺基准、缺对照、基线 schema 不符、或哨兵（PalORM_*/ADO_NET_*）缺失 → 一律 exit 1，
        # 不存在"不可判定即放行"的分支。
        run: |
          dotnet run --project tools/PalORM.PerfGate -c Release -- \
            check \
            --results BenchmarkDotNet.Artifacts/results \
            --baseline bench/baselines/perf-baseline.json

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-output.log
            BenchmarkDotNet.Artifacts/
          retention-days: 30
