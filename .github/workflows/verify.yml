# 可复用验证流水线（独立审计 M0-1）——ci.yml 与 release.yml 共享的单一验证真源。
# 走 workflow_call 在同一 run 内组合（否决 workflow_run：它在默认分支上运行并携带默认分支
# token 权限，PR 可借此影响发布路径）。
name: Verify

on:
    workflow_call:
        # 调用方（release.yml）可据此断言验证的就是待发布提交
        outputs:
            verified-sha:
                description: "被本流水线验证的 commit SHA"
                value: ${{ jobs.build.outputs.sha }}
    workflow_dispatch:

env:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_NOLOGO: true
    # ITM-415：快照防线不得在 CI 进入更新模式（SnapshotTests 另有 CI 环境守卫兜底）
    PALORM_UPDATE_SNAPSHOTS: ""

jobs:
    security:
        name: Secret Scan (gitleaks + custom)
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0  # 全历史扫描

            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Gitleaks (全历史)
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Custom Secret Guard (40 rules, changed files)
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # P0-2 修复：此前"构造 staged 环境 + 直接运行 hook"在 CI 恒空转
                  # （CI 无暂存区，secret-guard 读 git diff --cached 恒 exit 0，
                  # 40 类自定义规则实际从未消费 CI 差异集）。改用 --range 模式；
                  # 全历史兜底仍由上方 gitleaks 承担。差异基线口径与 gate job 对齐。
                  # 空 SHA 用 printf 构造而非 40 个零的字面量——40 位连续数字
                  # 会命中 secret-guard 的身份证号规则（真实误报，2026-08-25 提交实证）
                  ZERO_SHA=$(printf '%040d' 0)
                  if [ -n "$BASE_REF" ]; then
                      RANGE="origin/$BASE_REF..HEAD"
                  elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
                      RANGE="$BEFORE_SHA..HEAD"
                  else
                      echo "::notice::新分支首推无差异基线——全历史已由 gitleaks 覆盖"
                      exit 0
                  fi
                  dotnet run --file scripts/secret-guard.cs -- --range "$RANGE"

    build:
        name: Build (.NET 11)
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # workflow_call outputs 锚点：调用方（release.yml）断言验证的正是待发布提交
        outputs:
            sha: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore PalORM.ci.slnf

            - name: Build (Release, warnings as errors)
              run: >-
                  dotnet build PalORM.ci.slnf -c Release --no-restore --no-incremental
                  -warnaserror

    unit:
        name: Unit Tests
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Install dotnet-coverage (M3-1)
              run: dotnet tool install -g dotnet-coverage

            - name: Build
              run: dotnet build PalORM.ci.slnf -c Release --no-incremental

            - name: Core tests (with coverage, M3-1)
              # TUnit 1.69 起 --coverage-output 仅给文件名（含 ./ 前缀）时归一化进
              # --results-directory（默认 bin/.../TestResults/），断言步在 cwd 找不到；
              # 且显式传 --results-directory . 会把 tunit-report.json 一起改道出 bin，
              # 下一步 assert-test-counts 的 find bin 空参挂（run 36026357486 实测）。
              # 修法：传绝对路径（非"文件名"即原样落盘）——coverage 落 cwd、报告留 bin，两侧各得其所。
              run: >-
                  dotnet run --project test/PalORM.Core.Tests -c Release --no-build --
                  --coverage --coverage-output-format xml
                  --coverage-output "$(pwd)/cov-core.xml"

            - name: Assert Core test counts (M0-3)
              run: >-
                  dotnet run --file scripts/assert-test-counts.cs --
                  PalORM.Core.Tests
                  "$(find test/PalORM.Core.Tests/bin -name '*.tunit-report.json' | head -1)"

            - name: Assert Core coverage floor (M3-1)
              run: dotnet run --file scripts/assert-coverage.cs -- PalORM.Core cov-core.xml core

            - name: Source generator tests
              run: dotnet run --project test/PalORM.SourceGen.Tests -c Release --no-build

            - name: Assert SourceGen test counts (M0-3)
              run: >-
                  dotnet run --file scripts/assert-test-counts.cs --
                  PalORM.SourceGen.Tests
                  "$(find test/PalORM.SourceGen.Tests/bin -name '*.tunit-report.json' | head -1)"

    integration:
        name: Integration Tests
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: palorm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d palorm"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: palorm
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
            PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Build integration tests
              run: dotnet build test/PalORM.Integration.Tests -c Release

            - name: Install dotnet-coverage (provider coverage floors)
              run: dotnet tool install -g dotnet-coverage

            - name: Run complete integration suite (with coverage)
              # 2026-10-18 第二轮审计：provider 覆盖率此前完全空白（Core 覆盖率门禁测不到
              # provider 代码，集成测试跑真库但不收集覆盖率）。此处收集后再对 MySql/PostgreSql
              # 设地板，地板值 = 实测 -2pp（见 bench/baselines/test-counts.json）。
              run: >-
                  dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --
                  --coverage --coverage-output-format xml
                  --coverage-output "$(pwd)/cov-integration.xml"

            - name: Assert Integration test counts + real-db floor (M0-3)
              run: >-
                  dotnet run --file scripts/assert-test-counts.cs --
                  PalORM.Integration.Tests
                  "$(find test/PalORM.Integration.Tests/bin -name '*.tunit-report.json' | head -1)"

            - name: Assert provider coverage floors
              run: |
                  dotnet run --file scripts/assert-coverage.cs -- PalORM.MySql cov-integration.xml mysql
                  dotnet run --file scripts/assert-coverage.cs -- PalORM.PostgreSql cov-integration.xml postgresql

    gate:
        name: Quality Gates
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Check tracked diff
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # trailing whitespace 检查降级为 warning：
                  # Windows 开发者工作区经 autocrlf 转换后，diff 输出可能附加 CR 被误报。
                  # 真实 trailing whitespace（space/tab 在行末）仍会被检测——
                  # 用 grep 过滤掉纯 CR 报错（行末只有 \r 没有空格的）。
                  # 空 SHA 用 printf 构造而非 40 个零的字面量——40 位连续数字
                  # 会命中 secret-guard 的身份证号规则（同 secret-guard 步注释）
                  ZERO_SHA=$(printf '%040d' 0)
                  if [ -n "$BASE_REF" ]; then
                    DIFF_REF="origin/$BASE_REF...HEAD"
                  elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
                    DIFF_REF="$BEFORE_SHA...HEAD"
                  else
                    DIFF_REF=""
                  fi

                  if [ -n "$DIFF_REF" ]; then
                    OUTPUT=$(git diff --check "$DIFF_REF" 2>&1) || true
                  else
                    OUTPUT=$(git show --check --no-ext-diff HEAD 2>&1) || true
                  fi

                  # 过滤：trailing whitespace 行如果末尾只是 CR（无空格/tab），视为 CRLF 噪音
                  REAL_ISSUES=$(echo "$OUTPUT" | grep -E "trailing whitespace" | wc -l)
                  if [ -n "$OUTPUT" ]; then
                    echo "::warning::git diff --check 报告（含 CRLF 噪音）："
                    echo "$OUTPUT"
                  fi

            - name: Run stub gate
              run: dotnet run --file scripts/stub-check.cs

            # 2026-10-18 质量审计补接：以下五个门禁此前只在 pre-commit 或人工手动跑，
            # CI 完全无触发点——本地不装 hook（fresh clone / 外部贡献者 / Core.autocrlf
            # 差异环境）时，向 Core 加 Activator.CreateInstance、async void、.Result、
            # Provider 跨引用，或删测试跌破地板，都能一路绿灯合入。E5（G9 假红 3 天）
            # 的教训是「门禁无触发点」，当年只补了 pre-commit 没补 CI。
            # --ci 语义（各脚本内置）：跳过本地专属项（G33 脏树/领先远端/tag 对账）。
            - name: Storefront gates (G1-G33)
              run: dotnet run --file scripts/gate-check.cs -- --allow-dirty

            # 2026-10-18 第二轮审计补接：--public 只跑依赖主仓文件的校验
            # （V2/V6/V10/V12/V20），.ai 本地知识层相关项不参与。此前这些项在 CI 零覆盖，
            # 其中 V12 是 PALORM 诊断计数的双向对账（分析器实测 vs API参考声明）。
            - name: Consistency checks (public surface, V2/V6/V10/V12/V20)
              run: dotnet run --file scripts/verify-ai-system.cs -- --public

            # 每周定时/手动触发时追加变异探针电池（47 项）：证明各门禁仍能报红。
            # 探针会临时改写 src/ 下的文件，只在干净 checkout 上运行，故不在每次 push 执行。
            - name: Mutation probe battery (weekly/manual only)
              if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
              run: dotnet run --file scripts/verify-ai-system.cs -- --public --probes

            - name: Doc consistency (D4/D10-D14)
              run: dotnet run --file scripts/doc-consistency-check.cs

            - name: Tech debt scan (15 checks)
              run: dotnet run --file scripts/tech-debt-scan.cs -- --ci

            - name: Test spec gate (T4/T6/T8/T9/T11 + T-DEF-1/4 + 版本三方一致)
              run: dotnet run --file scripts/test-gate.cs -- --ci

            - name: Assertion strength ratchet
              run: dotnet run --file scripts/assertion-strength-check.cs -- --ci

            # 独立审计 M0-4：依赖 CVE 信号（此前完全空白——4 个运行时第三方包 +
            # Roslyn 的新 CVE 只能靠人工升级轮发现，GHSA-473q 类事件已实际发生过）。
            # NuGetAudit 在还原期报 NU1903/NU1904，但中央包管理 + 显式钉版本下
            # 传递面仍需 --include-transitive 覆盖；Critical/High 即失败。
            - name: Vulnerable dependency scan (transitive included)
              run: |
                  set -euo pipefail
                  ISSUES=$(dotnet list PalORM.ci.slnf package --vulnerable --include-transitive 2>&1 || true)
                  echo "$ISSUES"
                  CRITICAL_HIGH=$(echo "$ISSUES" | grep -cEi 'Severity:\s*(Critical|High)' || true)
                  if [ "$CRITICAL_HIGH" -gt 0 ]; then
                    echo "::error::发现 $CRITICAL_HIGH 个 Critical/High 级漏洞依赖——修复后再合并"
                    exit 1
                  fi

            - name: Run quality-script fixtures
              # v7.2 接线：夹具在 CI 自动跳过 .ai 段（本地工具不入库），
              # 仍回归仓库内防线——stub-check / SDK 固定 / secret-guard / 语言门禁
              run: dotnet run --file scripts/test-quality-scripts.cs

            - name: Param collection reuse gate (R-UNNESTB family)
              # 2026-10-06 接线（系统评估 P2-5）：标记制门禁原先只挂 pre-commit 与
              # quality-harness，本地之外（CI/克隆环境）无触发点——B160 触发链完整性。
              # 该门禁扫描 src/ 全部参数集合变更调用点的理由码声明，缺声明即失败。
              run: dotnet run --file scripts/gate-param-collection-reuse.cs

    aot-sqlite:
        name: SQLite Native AOT
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/sqlite

            - name: Run native binary
              run: ./artifacts/aot/sqlite/PalORM.AotTest

    aot-package-consumer:
        name: NuGet Consumer Native AOT
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Pack local packages
              run: |
                  dotnet pack src/PalORM.SourceGen -c Release -o artifacts/packages
                  dotnet pack src/PalORM.Core -c Release -o artifacts/packages
                  dotnet pack src/PalORM.Sqlite -c Release -o artifacts/packages

            - name: Validate package contracts
              run: dotnet run --file scripts/test-package-contract.cs

            - name: Restore package consumer
              run: >-
                  dotnet restore test/PalORM.PackageConsumer.Aot
                  --configfile test/PalORM.PackageConsumer.Aot/NuGet.config

            - name: Publish package consumer
              run: >-
                  dotnet publish test/PalORM.PackageConsumer.Aot -c Release -r linux-x64
                  --self-contained true --no-restore -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/package-consumer

            - name: Run native binary
              run: ./artifacts/aot/package-consumer/PalORM.PackageConsumer.Aot

            - name: Cold start wall clock (5 runs)
              # 冷启动墙钟观测（不作为门禁）：每轮新进程，记录进程启动到退出的毫秒数。
              # 与启动量具（单方法 IL 上界）互补——后者测规模，前者测真实进程启动。
              run: |
                  {
                    echo "### AOT consumer cold start"
                    echo ""
                    echo "| run | elapsed ms |"
                    echo "|---:|---:|"
                    for i in 1 2 3 4 5; do
                      start=$(date +%s%N)
                      ./artifacts/aot/package-consumer/PalORM.PackageConsumer.Aot > /dev/null
                      end=$(date +%s%N)
                      echo "| $i | $(( (end - start) / 1000000 )) |"
                    done
                  } | tee cold-start.log
                  cat cold-start.log >> "$GITHUB_STEP_SUMMARY"

    aot-postgresql:
        name: PostgreSQL Native AOT
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: palorm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d palorm"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest.Pg -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/postgresql

            - name: Run native binary
              run: ./artifacts/aot/postgresql/PalORM.AotTest.Pg

    aot-mysql:
        name: MySQL Native AOT
        runs-on: ubuntu-24.04
        needs: build
        timeout-minutes: 20
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: palorm
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest.MySql -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/mysql

            - name: Run native binary
              run: ./artifacts/aot/mysql/PalORM.AotTest.MySql
