# 可复用验证流水线（独立审计 M0-1）——ci.yml 与 release.yml 共享的单一验证真源。
# 走 workflow_call 在同一 run 内组合（否决 workflow_run：它在默认分支上运行并携带默认分支
# token 权限，PR 可借此影响发布路径）。
name: Verify

on:
    workflow_call:
        # 调用方（release.yml）可据此断言验证的就是待发布提交
        outputs:
            verified-sha:
                description: "被本流水线验证的 commit SHA"
                value: ${{ jobs.build.outputs.sha }}
    workflow_dispatch:

env:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_NOLOGO: true
    # ITM-415：快照防线不得在 CI 进入更新模式（SnapshotTests 另有 CI 环境守卫兜底）
    PALORM_UPDATE_SNAPSHOTS: ""

jobs:
    security:
        name: Secret Scan (gitleaks + custom)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # 全历史扫描

            - name: Gitleaks (全历史)
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Custom Secret Guard (40 rules, changed files)
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # P0-2 修复：此前"构造 staged 环境 + 直接运行 hook"在 CI 恒空转
                  # （CI 无暂存区，secret-guard 读 git diff --cached 恒 exit 0，
                  # 40 类自定义规则实际从未消费 CI 差异集）。改用 --range 模式；
                  # 全历史兜底仍由上方 gitleaks 承担。差异基线口径与 gate job 对齐。
                  chmod +x scripts/secret-guard.sh
                  # 空 SHA 用 printf 构造而非 40 个零的字面量——40 位连续数字
                  # 会命中 secret-guard 的身份证号规则（真实误报，2026-08-25 提交实证）
                  ZERO_SHA=$(printf '%040d' 0)
                  if [ -n "$BASE_REF" ]; then
                      RANGE="origin/$BASE_REF..HEAD"
                  elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
                      RANGE="$BEFORE_SHA..HEAD"
                  else
                      echo "::notice::新分支首推无差异基线——全历史已由 gitleaks 覆盖"
                      exit 0
                  fi
                  bash scripts/secret-guard.sh --range "$RANGE"

    build:
        name: Build (.NET 11)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # workflow_call outputs 锚点：调用方（release.yml）断言验证的正是待发布提交
        outputs:
            sha: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore PalORM.ci.slnf

            - name: Build (Release, warnings as errors)
              run: >-
                  dotnet build PalORM.ci.slnf -c Release --no-restore --no-incremental
                  -warnaserror

    unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Install dotnet-coverage (M3-1)
              run: dotnet tool install -g dotnet-coverage

            - name: Build
              run: dotnet build PalORM.ci.slnf -c Release --no-incremental

            - name: Core tests (with coverage, M3-1)
              # TUnit 1.69 起 --coverage-output 仅给文件名时落入 --results-directory
              #（bin/.../TestResults/），断言步在 cwd 找不到——显式钉 results-directory
              # 为 cwd，文件名保持 cov-core.xml 与断言步一致。
              run: >-
                  dotnet run --project test/PalORM.Core.Tests -c Release --no-build --
                  --coverage --coverage-output-format xml --coverage-output cov-core.xml
                  --results-directory .

            - name: Assert Core test counts (M0-3)
              run: >-
                  bash scripts/assert-test-counts.sh PalORM.Core.Tests
                  "$(find test/PalORM.Core.Tests/bin -name '*.tunit-report.json' | head -1)"

            - name: Assert Core coverage floor (M3-1)
              run: bash scripts/assert-coverage.sh PalORM.Core cov-core.xml core

            - name: Source generator tests
              run: dotnet run --project test/PalORM.SourceGen.Tests -c Release --no-build

            - name: Assert SourceGen test counts (M0-3)
              run: >-
                  bash scripts/assert-test-counts.sh PalORM.SourceGen.Tests
                  "$(find test/PalORM.SourceGen.Tests/bin -name '*.tunit-report.json' | head -1)"

    integration:
        name: Integration Tests
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: palorm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d palorm"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: palorm
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
            PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Build integration tests
              run: dotnet build test/PalORM.Integration.Tests -c Release

            - name: Run complete integration suite
              run: dotnet run --project test/PalORM.Integration.Tests -c Release --no-build

            - name: Assert Integration test counts + real-db floor (M0-3)
              run: >-
                  bash scripts/assert-test-counts.sh PalORM.Integration.Tests
                  "$(find test/PalORM.Integration.Tests/bin -name '*.tunit-report.json' | head -1)"

    gate:
        name: Quality Gates
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Check tracked diff
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  # trailing whitespace 检查降级为 warning：
                  # Windows 开发者工作区经 autocrlf 转换后，diff 输出可能附加 CR 被误报。
                  # 真实 trailing whitespace（space/tab 在行末）仍会被检测——
                  # 用 grep 过滤掉纯 CR 报错（行末只有 \r 没有空格的）。
                  # 空 SHA 用 printf 构造而非 40 个零的字面量——40 位连续数字
                  # 会命中 secret-guard 的身份证号规则（同 secret-guard 步注释）
                  ZERO_SHA=$(printf '%040d' 0)
                  if [ -n "$BASE_REF" ]; then
                    DIFF_REF="origin/$BASE_REF...HEAD"
                  elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
                    DIFF_REF="$BEFORE_SHA...HEAD"
                  else
                    DIFF_REF=""
                  fi

                  if [ -n "$DIFF_REF" ]; then
                    OUTPUT=$(git diff --check "$DIFF_REF" 2>&1) || true
                  else
                    OUTPUT=$(git show --check --no-ext-diff HEAD 2>&1) || true
                  fi

                  # 过滤：trailing whitespace 行如果末尾只是 CR（无空格/tab），视为 CRLF 噪音
                  REAL_ISSUES=$(echo "$OUTPUT" | grep -E "trailing whitespace" | wc -l)
                  if [ -n "$OUTPUT" ]; then
                    echo "::warning::git diff --check 报告（含 CRLF 噪音）："
                    echo "$OUTPUT"
                  fi

            - name: Run stub gate
              run: bash scripts/stub-check.sh

            # 独立审计 M0-4：依赖 CVE 信号（此前完全空白——4 个运行时第三方包 +
            # Roslyn 的新 CVE 只能靠人工升级轮发现，GHSA-473q 类事件已实际发生过）。
            # NuGetAudit 在还原期报 NU1903/NU1904，但中央包管理 + 显式钉版本下
            # 传递面仍需 --include-transitive 覆盖；Critical/High 即失败。
            - name: Vulnerable dependency scan (transitive included)
              run: |
                  set -euo pipefail
                  ISSUES=$(dotnet list PalORM.ci.slnf package --vulnerable --include-transitive 2>&1 || true)
                  echo "$ISSUES"
                  CRITICAL_HIGH=$(echo "$ISSUES" | grep -cEi 'Severity:\s*(Critical|High)' || true)
                  if [ "$CRITICAL_HIGH" -gt 0 ]; then
                    echo "::error::发现 $CRITICAL_HIGH 个 Critical/High 级漏洞依赖——修复后再合并"
                    exit 1
                  fi

            - name: Run quality-script fixtures
              # v7.2 接线：夹具在 CI 自动跳过 .ai 段（本地工具不入库），
              # 仍回归仓库内防线——stub-check / SDK 固定 / secret-guard 自测
              run: bash scripts/test-quality-scripts.sh

    aot-sqlite:
        name: SQLite Native AOT
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/sqlite

            - name: Run native binary
              run: ./artifacts/aot/sqlite/PalORM.AotTest

    aot-package-consumer:
        name: NuGet Consumer Native AOT
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Pack local packages
              run: |
                  dotnet pack src/PalORM.SourceGen -c Release -o artifacts/packages
                  dotnet pack src/PalORM.Core -c Release -o artifacts/packages
                  dotnet pack src/PalORM.Sqlite -c Release -o artifacts/packages

            - name: Validate package contracts
              run: bash scripts/test-package-contract.sh

            - name: Restore package consumer
              run: >-
                  dotnet restore test/PalORM.PackageConsumer.Aot
                  --configfile test/PalORM.PackageConsumer.Aot/NuGet.config

            - name: Publish package consumer
              run: >-
                  dotnet publish test/PalORM.PackageConsumer.Aot -c Release -r linux-x64
                  --self-contained true --no-restore -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/package-consumer

            - name: Run native binary
              run: ./artifacts/aot/package-consumer/PalORM.PackageConsumer.Aot

    aot-postgresql:
        name: PostgreSQL Native AOT
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: palorm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d palorm"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest.Pg -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/postgresql

            - name: Run native binary
              run: ./artifacts/aot/postgresql/PalORM.AotTest.Pg

    aot-mysql:
        name: MySQL Native AOT
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 20
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: palorm
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Publish
              run: >-
                  dotnet publish test/PalORM.AotTest.MySql -c Release -r linux-x64
                  --self-contained true -p:PublishAot=true -p:PublishTrimmed=true
                  -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/aot/mysql

            - name: Run native binary
              run: ./artifacts/aot/mysql/PalORM.AotTest.MySql
