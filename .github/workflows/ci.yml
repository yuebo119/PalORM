# PR/push 验证流水线——薄壳：全部验证作业在可复用的 verify.yml（独立审计 M0-1）。
# release.yml 调用同一 verify.yml，保证"发布所验 = PR 所验"（发布即证据）。
name: Build & Test

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]

jobs:
    verify:
        name: Verify (security + build + tests + gates + 4×AOT)
        uses: ./.github/workflows/verify.yml
