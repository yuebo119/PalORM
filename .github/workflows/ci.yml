# PR/push 验证流水线——薄壳：全部验证作业在可复用的 verify.yml（独立审计 M0-1）。
# release.yml 调用同一 verify.yml，保证"发布所验 = PR 所验"（发布即证据）。
name: Build & Test

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]
    # 每周一定时运行（03:00 UTC）：带变异探针的强化验证只在定时/手动触发时执行，
    # 避免每次 push 都付探针成本；探针本身必须定期跑，否则会退化成无声 no-op（lessons B189）。
    schedule:
        - cron: '0 3 * * 1'
    workflow_dispatch:

jobs:
    verify:
        name: Verify (security + build + tests + gates + 4×AOT)
        uses: ./.github/workflows/verify.yml
