name: Publish to NuGet

on:
    push:
        tags:
            - 'v*' # v5.0.0 / v5.1.0 等
    workflow_dispatch:
        inputs:
            version:
                description: '版本号（必须与 Directory.Build.props 的 <Version> 一致）'
                required: true
                type: string

# 同一 tag/ref 并发触发只跑一个，不取消进行中的发布（避免半成品）
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

env:
    DOTNET_CLI_TELEMETRY_OPTOUT: true
    DOTNET_NOLOGO: true

jobs:
    publish:
        name: Build + Test + Pack + Push
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write # 用于创建 GitHub Release
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                    POSTGRES_DB: palorm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d palorm"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: palorm
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # SourceLink 需要完整 git 历史

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json

            - name: Resolve version
              id: ver
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      VERSION="${{ github.event.inputs.version }}"
                  else
                      # tag 触发：从 tag 名剥离 v 前缀
                      VERSION="${GITHUB_REF_NAME#v}"
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Resolved version: $VERSION"

            - name: Verify version matches Directory.Build.props
              run: |
                  EXPECTED="${{ steps.ver.outputs.version }}"
                  ACTUAL=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
                  echo "Expected (tag/input): $EXPECTED"
                  echo "Actual (props):       $ACTUAL"
                  if [ "$EXPECTED" != "$ACTUAL" ]; then
                      echo "::error::版本不一致：tag=$EXPECTED props=$ACTUAL"
                      exit 1
                  fi

            - name: Restore
              run: dotnet restore PalORM.ci.slnf

            - name: Build (Release, warnings as errors)
              run: >-
                  dotnet build PalORM.ci.slnf -c Release --no-restore --no-incremental
                  -warnaserror

            - name: Unit tests
              run: |
                  dotnet run --project test/PalORM.Core.Tests -c Release --no-build --no-restore
                  dotnet run --project test/PalORM.SourceGen.Tests -c Release --no-build --no-restore

            - name: Integration tests (PostgreSQL + MySQL)
              env:
                  PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
                  PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
              run: |
                  dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --no-restore

            - name: Pack all src projects
              run: |
                  VERSION="${{ steps.ver.outputs.version }}"
                  # 5 个公开发布的包（PalORM.Testing 是内部测试库，IsPackable=false 不打包）
                  for proj in Core SourceGen Sqlite PostgreSql MySql; do
                      dotnet pack "src/PalORM.$proj/PalORM.$proj.csproj" \
                        -c Release --no-build \
                        -o artifacts/packages \
                        -p:Version="$VERSION"
                  done

            - name: Verify package count
              run: |
                  COUNT=$(find artifacts/packages -name "*.nupkg" | wc -l)
                  echo "Package count: $COUNT (expected 5)"
                  if [ "$COUNT" -ne 5 ]; then
                      echo "::error::预期 5 个 nupkg（Core/SourceGen/Sqlite/PostgreSql/MySql），实际 $COUNT 个"
                      exit 1
                  fi
                  ls -la artifacts/packages/

            - name: Push to NuGet.org
              run: >-
                  dotnet nuget push "artifacts/packages/*.nupkg"
                  --source https://api.nuget.org/v3/index.json
                  --api-key ${{ secrets.NUGET_API_KEY }}
                  --skip-duplicate

            - name: Extract Release Notes
              if: github.event_name == 'push'
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  # 提取 CHANGELOG.md 中当前版本段（从 ## [version] 到下一个 ## 或 EOF）
                  awk -v ver="$VERSION" '
                      /^## \[/ {
                          if (found) exit
                          if (index($0, "[" ver "]")) { found=1; next }
                      }
                      found { print }
                  ' CHANGELOG.md > release-notes.md

                  # 组装完整 Release Body
                  {
                      echo "## PalORM $GITHUB_REF_NAME"
                      echo ""
                      echo "### 📦 发布包"
                      echo ""
                      echo "| 包名 | 版本 |"
                      echo "|------|------|"
                      echo "| PalORM.Core | $VERSION |"
                      echo "| PalORM.Sqlite | $VERSION |"
                      echo "| PalORM.MySql | $VERSION |"
                      echo "| PalORM.PostgreSql | $VERSION |"
                      echo "| PalORM.SourceGen | $VERSION |"
                      echo ""
                      echo "### 📥 安装"
                      echo ""
                      echo '```bash'
                      echo "dotnet add package PalORM.Core --version $VERSION"
                      echo "dotnet add package PalORM.Sqlite --version $VERSION   # SQLite"
                      echo "dotnet add package PalORM.MySql --version $VERSION    # MySQL"
                      echo "dotnet add package PalORM.PostgreSql --version $VERSION # PostgreSQL"
                      echo '```'
                      echo ""
                      echo "### 📋 变更明细"
                      echo ""
                      cat release-notes.md
                      echo ""
                      echo "---"
                      echo ""
                      echo "**完整变更日志**: [CHANGELOG.md](https://github.com/yuebo119/PalORM/blob/main/CHANGELOG.md)"
                  } > full-release-body.md

            - name: Create GitHub Release
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: PalORM ${{ github.ref_name }}
                  body_path: full-release-body.md
                  files: |
                      artifacts/packages/*.nupkg
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
