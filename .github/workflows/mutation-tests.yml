name: Mutation Tests

on:
  # 每周六 03:00 UTC 自动运行（变异测试耗时长，不进 PR 门禁）
  schedule:
    - cron: '0 3 * * 6'
  # 手动触发
  workflow_dispatch:

# 排程与手动触发重叠时取消旧运行
concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Stryker (Core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Debug)
        run: dotnet build PalORM.ci.slnf -c Debug --no-incremental

      - name: Install dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      # 退出码协议：0=达标；1=得分低或失败（真信号→红）；3=上游阻塞（stryker MTP 预览
      # runner 已知缺陷 #3799 同族，修复 PR #3817 已合未发版）；4=变异面为空（0 个变异
      # 被测，无信息）。3/4 → notice 不判红（防止每周六已知阻塞红污染信号，狼来了效应），
      # 上游发版后自动恢复真实判定。
      - name: Run mutation suite (Core CRUD/Query/Bulk/SessionState)
        run: |
          dotnet run --file scripts/run-mutation-tests.cs -- core
          code=$?
          if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "::notice::变异测试无可评信号（exit $code：上游阻塞/变异面为空）——等待 stryker 发版自动恢复"
            exit 0
          fi
          exit $code

      # threshold-break=40：低于阈值时 dotnet-stryker 以非零码退出使本 job 变红——
      # 配置中的阈值自此真实生效（此前配置存在但无任何调度消费，评审 P1）
      - name: Upload Core mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-core-report
          path: test/PalORM.Core.Tests/StrykerOutput/**/reports/**
          retention-days: 30

  sourcegen:
    name: Stryker (SourceGen)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Debug)
        run: dotnet build PalORM.ci.slnf -c Debug --no-incremental

      - name: Install dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      # 退出码 3/4 → notice 不判红（同 Core job 注释）
      - name: Run mutation suite (SourceGen emitters + analyzer)
        run: |
          dotnet run --file scripts/run-mutation-tests.cs -- sourcegen
          code=$?
          if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "::notice::变异测试无可评信号（exit $code：上游阻塞/变异面为空）——等待 stryker 发版自动恢复"
            exit 0
          fi
          exit $code

      # SourceGen emitter 是本项目最大风险面（评审 P1：此前变异面完全未覆盖）
      - name: Upload SourceGen mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-sourcegen-report
          path: test/PalORM.SourceGen.Tests/StrykerOutput/**/reports/**
          retention-days: 30
