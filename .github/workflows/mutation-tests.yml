name: Mutation Tests

'on':
  # 每周六 03:00 UTC 自动运行（变异测试耗时长，不进 PR 门禁）
  schedule:
    - cron: '0 3 * * 6'
  # 手动触发
  workflow_dispatch:

# 排程与手动触发重叠时取消旧运行
concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Stryker (Core)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Debug)
        # MUT-1：变异 job 用与 Stryker 配置一致的 solution（只含 src/ 与 test/）。
        # 原 PalORM.ci.slnf 含 bench/tools 与 vendored 子树，干净检出下 Stryker 初次构建失败。
        run: dotnet build PalORM.mutation.slnx -c Debug --no-incremental

      - name: Install dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      # 退出码协议：0=达标；1=得分低或失败（真信号→红）；3=上游阻塞（stryker MTP 预览
      # runner 已知缺陷 #3799 同族，修复 PR #3817 已合未发版；2026-10-31 实测形态：
      # 构建路径已修复，但初始测试运行被 MTP 预览 runner 判为 >50% 失败）；4=无有效变异
      # （effectiveMutants=0，无信息）。3/4 → notice 不判红（防止已知阻塞红污染信号），
      # 上游发版后自动恢复真实判定。健康指标（effectiveMutants 等）由脚本写入 job summary。
      - name: Run mutation suite (Core CRUD/Query/Bulk/SessionState)
        run: |
          code=0
          dotnet run --file scripts/run-mutation-tests.cs -- core || code=$?
          if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "::notice::变异测试无可评信号（exit $code：上游阻塞/变异面为空）——等待 stryker 发版自动恢复"
            exit 0
          fi
          exit $code

      # threshold-break=40：低于阈值时 dotnet-stryker 以非零码退出使本 job 变红——
      # 配置中的阈值自此真实生效（此前配置存在但无任何调度消费，评审 P1）
      - name: Upload Core mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-core-report
          path: test/PalORM.Core.Tests/StrykerOutput/**/reports/**
          retention-days: 30

  sourcegen:
    name: Stryker (SourceGen)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Debug)
        # MUT-1：变异 job 用与 Stryker 配置一致的 solution（只含 src/ 与 test/）。
        # 原 PalORM.ci.slnf 含 bench/tools 与 vendored 子树，干净检出下 Stryker 初次构建失败。
        run: dotnet build PalORM.mutation.slnx -c Debug --no-incremental

      - name: Install dotnet-stryker
        run: dotnet tool install --global dotnet-stryker

      # 退出码 3/4 → notice 不判红（同 Core job 注释）
      - name: Run mutation suite (SourceGen emitters + analyzer)
        run: |
          code=0
          dotnet run --file scripts/run-mutation-tests.cs -- sourcegen || code=$?
          if [ "$code" -eq 3 ] || [ "$code" -eq 4 ]; then
            echo "::notice::变异测试无可评信号（exit $code：上游阻塞/变异面为空）——等待 stryker 发版自动恢复"
            exit 0
          fi
          exit $code

      # SourceGen emitter 是本项目最大风险面（评审 P1：此前变异面完全未覆盖）
      - name: Upload SourceGen mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-sourcegen-report
          path: test/PalORM.SourceGen.Tests/StrykerOutput/**/reports/**
          retention-days: 30
