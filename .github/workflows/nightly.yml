name: Nightly Test Lanes

# P1-C / DIALECT-4（测试体系增强方案 2026-10-31）：
# 夜间跑 PR 门禁不跑的三类工作——MySQL 版本矩阵、方言随机差分/pairwise、Windows 平台。
# 默认分支上每晚一次，也可手动触发。

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── COMPAT-1：MySQL 版本 lane ───────────────────────────────
  # 断言形态与结果两轴：8.0.18 必须回退 CASE WHEN；8.0.19 / 8.4 必须走 JOIN (VALUES ROW)。
  mysql-version-lane:
    name: MySQL ${{ matrix.mysql }} version lane
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.18', '8.0.19', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: palorm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration tests
        run: dotnet build test/PalORM.Integration.Tests -c Release
      - name: Run MySQL version lane
        env:
          PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        run: >-
          dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --
          --treenode-filter "/*/*/MySqlVersionLaneTests/*"

  # ── DIALECT-4：方言随机差分 + pairwise ─────────────────────
  # PALORM_NIGHTLY_DIALECT=1 是显式开关；DialectRandomDiffTests.NightlyDialect_GateIsEnabled
  # 在开关缺失时直接报红，防止整组空跑被当成绿。
  dialect-nightly:
    name: Dialect random diff and pairwise (PG + MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: palorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d palorm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: palorm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 30
    env:
      PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
      PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
      PALORM_NIGHTLY_DIALECT: '1'
      PALORM_NIGHTLY_SEED: '20261031'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration tests
        run: dotnet build test/PalORM.Integration.Tests -c Release
      - name: Run nightly dialect lanes
        # marker 自证：DialectRandomDiffTests 每个通过用例打印 NIGHTLY-DIALECT-RAN，
        # 期望 4 条（2 方言 × 随机差分为与 pairwise）。少于 4 条说明 lane 未真正执行，
        # 即使进程退出码为 0 也判红（防空跑被当成绿）。
        run: |
          dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --             --treenode-filter "/*/*/DialectRandomDiffTests/*" > nightly.log 2>&1
          code=$?
          cat nightly.log
          count=$(grep -c "NIGHTLY-DIALECT-RAN" nightly.log || true)
          if [ "$count" -lt 4 ]; then
            echo "::error::夜间方言 lane 只记录到 $count/4 个执行 marker（开关或过滤器失效）"
            exit 1
          fi
          exit $code

  # ── COMPAT-3：Windows 平台 lane ────────────────────────────
  windows-core-sourcegen:
    name: Windows Core + SourceGen
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build PalORM.ci.slnf -c Debug
      - name: Core tests
        run: dotnet run --project test/PalORM.Core.Tests -c Debug --no-build
      - name: SourceGen tests
        run: dotnet run --project test/PalORM.SourceGen.Tests -c Debug --no-build
      # 可选：win-x64 NativeAOT 发布。失败不红（AOT 需要 VS C++ 工具链，runner 镜像未必齐备），
      # 但日志必须可读：失败时保留完整输出供人工判读。
      - name: Optional win-x64 NativeAOT publish
        continue-on-error: true
        run: dotnet publish test/PalORM.AotTest -c Release -r win-x64 --self-contained