name: Nightly Test Lanes

# P1-C / DIALECT-4（测试体系增强方案 2026-10-31）：
# 夜间跑 PR 门禁不跑的三类工作——MySQL 版本矩阵、方言随机差分/pairwise、Windows 平台。
# 默认分支上每晚一次，也可手动触发。

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── COMPAT-1：MySQL 版本 lane ───────────────────────────────
  # 断言形态与结果两轴：8.0.18 必须回退 CASE WHEN；8.0.19 / 8.4 必须走 JOIN (VALUES ROW)。
  mysql-version-lane:
    name: MySQL ${{ matrix.mysql }} version lane
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.18', '8.0.19', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: palorm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration tests
        run: dotnet build test/PalORM.Integration.Tests -c Release
      - name: Run MySQL version lane
        env:
          PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
        run: >-
          dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --
          --treenode-filter "/*/*/MySqlVersionLaneTests/*"

  # ── DIALECT-4：方言随机差分 + pairwise ─────────────────────
  # PALORM_NIGHTLY_DIALECT=1 是显式开关；DialectRandomDiffTests.NightlyDialect_GateIsEnabled
  # 在开关缺失时直接报红，防止整组空跑被当成绿。
  dialect-nightly:
    name: Dialect random diff and pairwise (PG + MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: palorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d palorm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: palorm
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries 30
    env:
      PALORM_PG_CONNECTION: Host=127.0.0.1;Username=postgres;Database=palorm
      PALORM_MYSQL_CONNECTION: Server=127.0.0.1;User=root;Database=palorm
      PALORM_NIGHTLY_DIALECT: '1'
      PALORM_NIGHTLY_SEED: '20261031'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration tests
        run: dotnet build test/PalORM.Integration.Tests -c Release
      - name: Run nightly dialect lanes
        # marker 自证：DialectRandomDiffTests 每个通过用例打印 NIGHTLY-DIALECT-RAN，
        # 期望 4 条（2 方言 × 随机差分与 pairwise）。少于 4 条说明 lane 未真正执行，
        # 即使进程退出码为 0 也判红（防空跑被当成绿）。
        # 2026-11-04 修：MTP v2.5.1 在 Linux 上不把测试进程的 Console.WriteLine 转发到
        # 控制台（stdout 只有 MTP 自己的摘要），marker 实际落在 tunit-report.json 的
        # tests[].output 字段——本 lane 创建以来从未绿过（run 41557623286/41740012207，
        # 测试本体 4/4 通过、marker 0/4）。改为优先数报告 JSON，stdout grep 只作兜底。
        run: |
          dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --             --treenode-filter "/*/*/DialectRandomDiffTests/*" > nightly.log 2>&1
          code=$?
          cat nightly.log
          report=$(find test/PalORM.Integration.Tests/bin -name '*.tunit-report.json' | head -1)
          stdout_count=$(grep -c "NIGHTLY-DIALECT-RAN" nightly.log || true)
          report_count=0
          if [ -n "$report" ]; then
            # 报告是单行 JSON：grep -c 数行恒 1，必须 -o 逐次出现计数
            report_count=$(grep -o "NIGHTLY-DIALECT-RAN" "$report" | wc -l || true)
          else
            echo "::warning::tunit-report.json 未找到，marker 只按 stdout 统计"
          fi
          count=$((stdout_count > report_count ? stdout_count : report_count))
          if [ "$count" -lt 4 ]; then
            echo "::error::夜间方言 lane 只记录到 $count/4 个执行 marker（stdout=$stdout_count 报告=$report_count；开关或过滤器失效）"
            exit 1
          fi
          exit $code

  # ── FIX-7：SQLite 随机探索（PALORM_FUZZ_SEED 接线，2026-11-04）────
  # 探索模式在 PR 路径恒空转（未设环境变量即直接返回），此前 PALORM_FUZZ_SEED 在
  # .github/ 下零引用，D 层的「网格外」覆盖从未启用。本 lane 每晚推进一个种子
  # （run_number 递增，失败时按 run 号可重放），并以 FUZZ-EXPLORE-RAN 标记自证执行过。
  fuzz-explore:
    name: SQLite random exploration (PALORM_FUZZ_SEED)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PALORM_FUZZ_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build integration tests
        run: dotnet build test/PalORM.Integration.Tests -c Release
      - name: Run exploration seed
        # marker 自证：环境变量未传入或过滤器失效时用例会静默返回（无标记），
        # 此时即使退出码 0 也判红。MTP 在 Linux 上不转发测试进程 stdout，
        # 标记优先从 tunit-report.json 的 tests[].output 统计（与方言 lane 同因）。
        run: |
          dotnet run --project test/PalORM.Integration.Tests -c Release --no-build --             --treenode-filter "/*/*/RandomDiffTests/*" > fuzz.log 2>&1
          code=$?
          cat fuzz.log
          report=$(find test/PalORM.Integration.Tests/bin -name '*.tunit-report.json' | head -1)
          stdout_count=$(grep -c "FUZZ-EXPLORE-RAN" fuzz.log || true)
          report_count=0
          if [ -n "$report" ]; then
            report_count=$(grep -o "FUZZ-EXPLORE-RAN" "$report" | wc -l || true)
          else
            echo "::warning::tunit-report.json 未找到，marker 只按 stdout 统计"
          fi
          count=$((stdout_count > report_count ? stdout_count : report_count))
          if [ "$count" -lt 1 ]; then
            echo "::error::探索种子未执行（PALORM_FUZZ_SEED=$PALORM_FUZZ_SEED 未传入或过滤器失效）"
            exit 1
          fi
          exit $code
      - name: Upload fuzz failure samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: artifacts/fuzz-failures-*.txt
          retention-days: 90
          if-no-files-found: ignore

  # ── MUT-6/MUT-7：产品侧变异回放 + 判别力分数（2026-11-04）─────
  # 变异分本体（Stryker）自 2026-10-03 起 effectiveMutants=0，整体判别力无基线；
  # 本 lane 跑自建回放：每条规则注入一个已知缺陷，要求指定测试报红、还原后转绿。
  # 分数与契约覆盖写进 job summary，报告留 90 天 artifact 供趋势对比。
  mutation-replay:
    name: Mutation replay and discrimination score
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # 回放逐条注入后靠 git checkout 还原，浅克隆下还原失败会污染工作树
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Replay mutation rules
        run: |
          dotnet run --file scripts/conformance-mutation-replay.cs -- --report artifacts/mutation-report.json 2>&1 | tee mutation-replay.log
          exit ${PIPESTATUS[0]}
      - name: Score and write job summary
        # 回放红也要出分数与台账：判据（分数）与执行（回放）解耦，否则失败现场只剩一行退出码
        if: always()
        run: |
          if [ ! -f artifacts/mutation-report.json ]; then
            echo "::error::回放报告缺失（回放中途中止，未跑到写报告点）"
            exit 1
          fi
          dotnet run --file scripts/mutation-score.cs -- --report artifacts/mutation-report.json
          {
            echo "## 变异回放与判别力分数"
            echo ""
            echo '```'
            grep -E "^(score=|上一轮|判别力分数)" <(dotnet run --file scripts/mutation-score.cs -- --report artifacts/mutation-report.json 2>&1) || true
            echo '```'
            echo ""
            echo "### 规则台账"
            echo '```'
            grep -E "^\| R-|^全部规则通过|规则未通过" mutation-replay.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            artifacts/mutation-report.json
            mutation-replay.log
          retention-days: 90
          if-no-files-found: warn

  # ── COMPAT-3：Windows 平台 lane ────────────────────────────
  windows-core-sourcegen:
    name: Windows Core + SourceGen
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build PalORM.ci.slnf -c Debug
      - name: Core tests
        run: dotnet run --project test/PalORM.Core.Tests -c Debug --no-build
      - name: SourceGen tests
        run: dotnet run --project test/PalORM.SourceGen.Tests -c Debug --no-build
      # 可选：win-x64 NativeAOT 发布。失败不红（AOT 需要 VS C++ 工具链，runner 镜像未必齐备），
      # 但日志必须可读：失败时保留完整输出供人工判读。
      - name: Optional win-x64 NativeAOT publish
        continue-on-error: true
        run: dotnet publish test/PalORM.AotTest -c Release -r win-x64 --self-contained